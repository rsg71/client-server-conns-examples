<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Long Polling</h1>
    <script>
        async function poll() {
            try {
                const res = await fetch('/poll');
                const data = await res.json();

                console.log('received:', data);
            } catch (err) {
                console.error('poll error:', err);
                await new Promise(r => setTimeout(r, 1000)); // wait before retrying on error
            }

            poll(); // immediately long poll again
        }

        poll();
    </script>

</body>

</html>
